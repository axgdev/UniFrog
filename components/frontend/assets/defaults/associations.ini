# File associations in /unifrog_data/unifrog.ini.
#
# Every extension supports two keys:
#   extension.EXT.handlers=HANDLER1,HANDLER2,...
#     Ordered list shown by Open With. A handler is an installed core ID,
#     "media" for automatic media playback, "reader" for images/documents,
#     or native, ffmpeg, wav-auddec, hcplayer, hcplayer-audio, or
#     hcplayer-muted. wav-auddec is WAV-only; HCPlayer routes require the
#     firmware media build; native and ffmpeg do not open images. A list can
#     contain up to 8 unique handlers; handler IDs can contain up to 31
#     characters.
#   extension.EXT.default=HANDLER
#     Handler used when A is pressed. Press X in Open With to change this
#     directly on the device.
# EXT is case-insensitive, contains up to 15 characters, and can be a compound
# suffix such as p8.png.
#
# Open With -> Other Cores always exposes every installed core, so unusual or
# homebrew content is never blocked by this file. Compound suffixes are valid:
# extension.p8.png matches PICO-8 PNG cartridges without claiming every PNG.

# Prosty variants are optimized alternatives, deliberately listed after the
# upstream-based defaults. They remain selectable through Open With and X can
# save either choice as the new default on the device.
extension.gba.handlers=gpsp,gpsp-gbac-prosty
extension.gba.default=gpsp

extension.gb.handlers=gambatte,gambatte-prosty,gearboy
extension.gb.default=gambatte
extension.gbc.handlers=gambatte,gambatte-prosty,gearboy
extension.gbc.default=gambatte

extension.nes.handlers=quicknes,fceumm,quicknes-prosty,fceumm-prosty
extension.nes.default=quicknes
extension.fds.handlers=fceumm,quicknes,fceumm-prosty
extension.fds.default=fceumm

extension.sfc.handlers=snes9x2005,snes9x2002,snes9x2005-prosty,snes9x2002-prosty
extension.sfc.default=snes9x2005
extension.smc.handlers=snes9x2005,snes9x2002,snes9x2005-prosty,snes9x2002-prosty
extension.smc.default=snes9x2005

# Atari 2600/5200/7800 and Atari 8-bit computers. Generic .bin files are not
# assigned globally because several unrelated systems use that extension;
# launch those through a system folder mapping or Open With instead.
