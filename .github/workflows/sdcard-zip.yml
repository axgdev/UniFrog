name: SD card package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdcard-zip:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install packages
        run: apk add git make dtc tcc tcc-libs-static musl-dev zlib-dev ccache curl tar xz zip patch

      - name: Check out UniFrog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Configure Git
        env:
          FROG2K_JAVASCRIPT_TOKEN: ${{ secrets.FROG2K_JAVASCRIPT_TOKEN }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git config --global user.name "UniFrog CI"
          git config --global user.email "ci@unifrog.local"
          test -n "$FROG2K_JAVASCRIPT_TOKEN" || {
            echo "missing repository secret: FROG2K_JAVASCRIPT_TOKEN" >&2
            exit 1
          }
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/unifrog-gitconfig"
          git config --global \
            url."https://x-access-token:${FROG2K_JAVASCRIPT_TOKEN}@github.com/axgdev/frog2k-javascript-private.git".insteadOf \
            "git@github.com:axgdev/frog2k-javascript-private.git"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Verify build ref
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          git describe --tags --always --dirty
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: unifrog-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            unifrog-ccache-${{ runner.os }}-

      - name: Cache core sources
        uses: actions/cache@v4
        with:
          path: |
            .deps/cores
            .deps/support
          key: unifrog-cores-${{ runner.os }}-${{ hashFiles('cores/manifest.mk', 'cores/patches/**/*.patch') }}
          restore-keys: |
            unifrog-cores-${{ runner.os }}-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build SD card package
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          archive="Unifrog-sdcard-${GITHUB_REF_NAME}.zip"
          make ci-sd-zip \
            JOBS="$jobs" \
            HOSTCC=tcc \
            CCACHE=ccache \
            TOOLCHAIN="$PWD/toolchain" \
            CI_SDZIP="$PWD/$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Upload SD card package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: ${{ env.archive }}

      - name: Upload draft release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ env.archive }}
