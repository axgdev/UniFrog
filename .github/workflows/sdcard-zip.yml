name: SD card package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdcard-zip:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install packages
        run: apk add git make dtc tcc tcc-libs-static musl-dev ccache curl tar xz zip patch

      - name: Check out UniFrog
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global user.name "UniFrog CI"
          git config --global user.email "ci@unifrog.local"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: unifrog-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            unifrog-ccache-${{ runner.os }}-

      - name: Cache core sources
        uses: actions/cache@v4
        with:
          path: |
            .deps/cores
            .deps/support
          key: unifrog-cores-${{ runner.os }}-${{ hashFiles('cores/manifest.mk', 'cores/patches/**/*.patch') }}
          restore-keys: |
            unifrog-cores-${{ runner.os }}-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build SD card package
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          make ci-sd-zip HOSTCC=tcc CCACHE=ccache TOOLCHAIN="$PWD/toolchain"

      - name: Upload SD card package
        uses: actions/upload-artifact@v4
        with:
          name: UniFrog-sdcard
          path: UniFrog-local-sdcard.zip

      - name: Upload draft release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: UniFrog-local-sdcard.zip
