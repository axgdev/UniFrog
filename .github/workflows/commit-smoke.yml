name: Commit smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-smoke:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install packages
        run: apk add git make dtc tcc tcc-libs-static musl-dev zlib-dev curl tar xz zip patch

      - name: Check out UniFrog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global user.name "UniFrog CI"
          git config --global user.email "ci@unifrog.local"

      - name: Cache core sources
        uses: actions/cache@v4
        with:
          path: |
            .deps/cores
            .deps/support
          key: unifrog-cores-${{ runner.os }}-${{ hashFiles('cores/manifest.mk', 'cores/patches/**/*.patch') }}
          restore-keys: |
            unifrog-cores-${{ runner.os }}-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Check current commit
        run: |
          make ci-commit-smoke HOSTCC=tcc TOOLCHAIN="$PWD/toolchain"
