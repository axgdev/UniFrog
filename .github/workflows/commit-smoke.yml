name: Commit smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-smoke:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install packages
        run: apk add git make dtc tcc ccache curl tar xz zip patch

      - name: Check out UniFrog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: unifrog-smoke-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            unifrog-smoke-ccache-${{ runner.os }}-${{ github.ref_name }}-
            unifrog-smoke-ccache-${{ runner.os }}-

      - name: Cache core sources
        uses: actions/cache@v4
        with:
          path: |
            .deps/cores
            .deps/support
          key: unifrog-cores-${{ runner.os }}-${{ hashFiles('cores/manifest.mk', 'cores/patches/**/*.patch') }}
          restore-keys: |
            unifrog-cores-${{ runner.os }}-

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            unifrog-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Check each commit
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            case "${{ github.event.before }}" in
              0000000000000000000000000000000000000000) range="HEAD" ;;
              *) range="${{ github.event.before }}..HEAD" ;;
            esac
          fi

          for commit in $(git rev-list --reverse "$range"); do
            echo "Checking $commit"
            git checkout --detach "$commit"
            make ci-commit-check HOSTCC=tcc CCACHE=ccache TOOLCHAIN="$PWD/toolchain"
          done
